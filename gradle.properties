org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.247
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# 3D Skin Layers - compiled against for its mesh API. Swap the file in libs/ and this
# filename to build against a different version.
skinlayers_jar_name=skinlayers3d-neoforge-1_11_2-mc1_21_1.jar

# Elytra Slot - compiled against for the optional curios-slot render layer mixin.
elytraslot_jar_name=elytraslot-neoforge-9_0_2_1_21_1.jar

# Mod metadata
mod_id=elytra3d
mod_name=3D Elytra
mod_license=MIT
mod_version=1.9.3
mod_group_id=com.example.elytra3d
mod_authors=You
mod_description=Renders the elytra as a 3D extruded model instead of a flat plane, using 3D Skin Layers' mesh API.

# Deeper and Darker - compileOnly for Soul Elytra texture resolver
deeperdarker_jar_name=deeperdarker-neoforge-1_21_1-1_4_1.jar

# Curios API - compileOnly for accessory slot scanning
curios_version=9.5.1+1.21.1
