plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        configureEach {
            systemProperty 'forge.logging.markers', ''
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
}

dependencies {
    // No Mixin dependency or annotation processor here on purpose. NeoForge already provides
    // Mixin on the compile and runtime classpath, and since 1.20.2 it runs on Mojang's official
    // mappings - so mixins targeting vanilla classes need no refmap and no obfuscation lookup.
    // Adding the standalone AP makes it try to resolve SRG mappings that don't exist here.

    // 3D Skin Layers: compileOnly - we compile against its public API but never bundle it.
    // It's declared as a required dependency in neoforge.mods.toml instead.
    compileOnly files("libs/${skinlayers_jar_name}")

    // Elytra Slot: compileOnly, so the optional ElytraSlotLayerMixin can compile against its
    // render layer class. Not bundled; the mixin config is optional and simply doesn't apply
    // when Elytra Slot isn't installed.
    compileOnly files("libs/${elytraslot_jar_name}")

    // Deeper and Darker: compileOnly, so ElytraTextureResolver can be compiled with the
    // Soul Elytra's item class available for instanceof checks. Not bundled or required.
    compileOnly files("libs/${deeperdarker_jar_name}")

    // Curios: compileOnly, so ElytraTextureResolver can call CuriosApi and ICuriosItemHandler
    // to scan accessory slots. Not bundled; guarded by ModList.isLoaded at runtime.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
